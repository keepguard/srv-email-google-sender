apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-email-google-sender
  labels:
    app: srv-email-google-sender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-email-google-sender
  template:
    metadata:
      labels:
        app: srv-email-google-sender
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: srv-email-google-sender
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED
          value: "false"
        - name: APP_ENV
          value: {{ .Values.env.appEnv | quote }}
        - name: RABBITMQ_HOST
          value: {{ .Values.env.rabbitmqHost | quote }}
        - name: RABBITMQ_PORT
          value: {{ .Values.env.rabbitmqPort | quote }}
        ports:
        - containerPort: {{ .Values.service.port }}
        volumeMounts:
        - name: secure-volume
          mountPath: /app/secure
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: secure-volume
        secret:
          secretName: srv-email-secure

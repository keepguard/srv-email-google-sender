
app:
  name: srv-email-google-sender
  version: "1.1.5-SNAPSHOT"

server:
  host: 0.0.0.0
  port: 8602

gmail:
  sender_email: keepguard.ia@gmail.com
  client_secrets_file: ./secure/credentials-local.json
  token_file: ./secure/token.json
  scopes:
    - https://www.googleapis.com/auth/gmail.send
  auth_mode: token-only  # Com refresh automático
  # Configurações de monitoramento de token
  token_monitor:
    enabled: true
    check_interval_minutes: 30
    auto_refresh: true
    fallback_to_console: true
  # Token Manager integration
  token_manager:
    enabled: true
    base_url: http://srv-token-manager:8700
    timeout: 10
    retry_attempts: 3

rabbitmq:
  host: localhost
  port: 5672
  user: guest
  password: guest
  vhost: /
  queues:
    email_send: srv.email.google.sender.message.send.local
    email_send_dlt: srv.email.google.sender.message.send.dlt.local
  exchanges:
    email_exchange: srv-email-google-sender-exchange-local
    email_exchange_dlt: srv-email-google-sender-exchange-dlt-local
  routing_keys:
    email_send: email.google.send
    email_failed: email.failed
  retry:
    max_attempts: 3
    initial_delay_seconds: 5

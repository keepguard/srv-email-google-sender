services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    platform: linux/amd64
    container_name: pg_core
    restart: always
    environment:
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: 'false'
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - pg_core_data:/var/lib/postgresql/data
    networks:
      - core_net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
  redis:
    image: redis:${REDIS_VERSION}
    platform: linux/amd64
    container_name: redis_core
    restart: always
    command: 'redis-server --port 6379 --appendonly yes --appendfsync everysec --save 300 10 --save 60 10000 --dir /data

      '
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redis_core_data:/data
    networks:
      - core_net
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -p
        - '6379'
        - ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION}
    platform: linux/amd64
    container_name: rabbitmq_core
    hostname: rabbit-1
    restart: always
    environment:
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: 'false'
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - ${RABBITMQ_PORT:-5672}:5672
      - ${RABBITMQ_MANAGEMENT_PORT:-15672}:15672
    volumes:
      - rabbitmq_core_data:/var/lib/rabbitmq
    networks:
      - core_net
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
  minio:
    image: minio/minio:${MINIO_VERSION}
    platform: linux/amd64
    container_name: minio_core
    restart: always
    command: server /data --console-address ":9100"
    environment:
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: 'false'
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DOMAIN: ${MINIO_DOMAIN}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
    ports:
      - ${MINIO_API_PORT:-9000}:9000
      - ${MINIO_CONSOLE_PORT:-9100}:9100
    volumes:
      - minio_core_data:/data
    networks:
      - core_net
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
  minio-client:
    image: minio/mc:${MINIO_CLIENT_VERSION}
    platform: linux/amd64
    container_name: minio_client_core
    depends_on:
      minio:
        condition: service_healthy
    environment:
      SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: 'false'
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - core_net
    entrypoint: '/bin/sh -c " echo ''Configurando MinIO Client...''; /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; /usr/bin/mc mb myminio/keepguard-consents --ignore-existing; /usr/bin/mc mb myminio/keepguard-avatars --ignore-existing; /usr/bin/mc mb myminio/keepguard-documents --ignore-existing; /usr/bin/mc anonymous set download myminio/keepguard-consents/published; /usr/bin/mc version enable myminio/keepguard-consents; echo ''MinIO configurado com sucesso!''; exit 0; "

      '
  ms-auth:
    image: ghcr.io/keepguard/ms-auth:1.0.2
    container_name: ms_auth
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=${MS_AUTH_PORT}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - COMPANY_SERVICE_URL=${MS_COMPANY_URL:-http://ms-company:8083}
      - USER_SERVICE_URL=${MS_USER_URL:-http://ms-user:8085}
      - COMMUNICATION_SERVICE_URL=${MS_COMMUNICATION_URL:-http://ms-communication:8082}
      - KEEPGUARD_VALIDATION_MODERATION_ENABLED=false
    ports:
      - ${MS_AUTH_PORT}:8081
    networks:
      - core_net
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8081/actuator/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
  ms-communication:
    image: ghcr.io/keepguard/ms-communication:1.0.14-1.0.0
    container_name: ms_communication
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=${MS_COMMUNICATION_PORT}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - KEEPGUARD_VALIDATION_MODERATION_ENABLED=false
    ports:
      - ${MS_COMMUNICATION_PORT}:8082
    networks:
      - core_net
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8082/actuator/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
  ms-company:
    image: ghcr.io/keepguard/ms-company:1.0.9-1.0.0
    container_name: ms_company
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=${MS_COMPANY_PORT}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - KEEPGUARD_VALIDATION_MODERATION_ENABLED=false
    ports:
      - ${MS_COMPANY_PORT}:8083
    networks:
      - core_net
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8083/actuator/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
  ms-user:
    image: ghcr.io/keepguard/ms-user:1.0.4-1.0.1
    container_name: ms_user
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=${MS_USER_PORT}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - KEEPGUARD_VALIDATION_MODERATION_ENABLED=false
    ports:
      - ${MS_USER_PORT}:8085
    networks:
      - core_net
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8085/actuator/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
  ms-user-consents:
    image: ghcr.io/keepguard/ms-user-consents:1.0.1
    container_name: ms_user_consents
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=${MS_USER_CONSENTS_PORT}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}
      - STORAGE_MINIO_ENDPOINT=http://minio:9000
      - KEEPGUARD_VALIDATION_MODERATION_ENABLED=false
    ports:
      - ${MS_USER_CONSENTS_PORT}:8086
    networks:
      - core_net
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8086/actuator/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
  srv-email-google-sender:
    image: ghcr.io/keepguard/srv-email-google-sender:1.1.2
    container_name: srv_email_google_sender
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - APP_ENV=${APP_ENV}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
    ports:
      - ${SRV_EMAIL_PORT}:8601
    volumes:
      - ../backend/srv/srv-email-google-sender/secure:/app/secure
    networks:
      - core_net
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8601/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  srv-token-manager:
    image: ghcr.io/keepguard/srv-token-manager:1.0.8
    container_name: srv_token_manager
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - APP_ENV=${APP_ENV}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    ports:
      - ${SRV_TOKEN_PORT}:8700
    volumes:
      - ../backend/srv/srv-token-manager/secure:/app/secure
    networks:
      - core_net
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8700/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  bff-core:
    image: ghcr.io/keepguard/bff-core:1.0.20
    container_name: bff_core
    restart: always
    depends_on:
      ms-user:
        condition: service_healthy
      ms-company:
        condition: service_healthy
      ms-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=${SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED:-false}
      - BFF_CORE_ENV=${BFF_CORE_ENV:-dev}
      - BFF_CORE_RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - BFF_CORE_SERVICES_COMPANY_BASE_URL=${MS_COMPANY_URL:-http://ms-company:8083}
      - BFF_CORE_SERVICES_USER_BASE_URL=${MS_USER_URL:-http://ms-user:8085}
      - BFF_CORE_SERVICES_AUTH_BASE_URL=${MS_AUTH_URL:-http://ms-auth:8081}
      - BFF_CORE_SERVICES_COMMUNICATION_BASE_URL=${MS_COMMUNICATION_URL:-http://ms-communication:8082}
      - BFF_CORE_SERVICES_USER_CONSENTS_BASE_URL=${MS_USER_CONSENTS_URL:-http://ms-user-consents:8086}
      - BFF_CORE_SERVICES_USER_PROFILE_BASE_URL=${MS_USER_PROFILE_URL:-http://ms-user-profile:8091}
      - KEEPGUARD_VALIDATION_MODERATION_ENABLED=${KEEPGUARD_VALIDATION_MODERATION_ENABLED:-false}
    ports:
      - ${BFF_CORE_HOST_PORT:-8382}:8382
    networks:
      - core_net
  bff-auth:
    image: ghcr.io/keepguard/bff-auth:1.0.14
    container_name: bff_auth
    restart: always
    depends_on:
      ms-auth:
        condition: service_healthy
      ms-company:
        condition: service_healthy
    environment:
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=${SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED:-false}
      - BFF_AUTH_ENV=${BFF_AUTH_ENV:-dev}
      - BFF_AUTH_RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - BFF_AUTH_SERVICES_COMPANY_BASE_URL=${MS_COMPANY_URL:-http://ms-company:8083}
      - BFF_AUTH_SERVICES_USER_BASE_URL=${MS_USER_URL:-http://ms-user:8085}
      - BFF_AUTH_SERVICES_AUTH_BASE_URL=${MS_AUTH_URL:-http://ms-auth:8081}
      - BFF_AUTH_SERVICES_COMMUNICATION_BASE_URL=${MS_COMMUNICATION_URL:-http://ms-communication:8082}
      - KEEPGUARD_VALIDATION_MODERATION_ENABLED=${KEEPGUARD_VALIDATION_MODERATION_ENABLED:-false}
    ports:
      - ${BFF_AUTH_HOST_PORT:-8381}:8381
    networks:
      - core_net

  mock-sms-gateway:
    build:
      context: ../backend/ms/mock-sms-gateway
      dockerfile: Dockerfile
    container_name: mock_sms_gateway
    restart: always
    environment:
      - SERVER_PORT=8089
    ports:
      - "8089:8089"
    networks:
      - core_net

  srv-sms-sender:
    image: ghcr.io/keepguard/srv-sms-sender:1.0.0
    container_name: srv_sms_sender
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      mock-sms-gateway:
        condition: service_started
    environment:
      - RABBITMQ_URI=amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@${RABBITMQ_HOST:-rabbitmq}:5672/
      - RABBITMQ_QUEUE_SMS=keepguard.notifications.sms
      - SMS_GATEWAY_URL=http://mock-sms-gateway:8089
      - SMS_GATEWAY_API_KEY=keepguard-mock-secret-key
    networks:
      - core_net
volumes:
  pg_core_data:
    driver: local
  redis_core_data:
    driver: local
  rabbitmq_core_data:
    driver: local
  minio_core_data:
    driver: local
networks:
  core_net:
    driver: bridge

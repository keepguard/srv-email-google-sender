
# Local overrides (mantemos token-only conforme pedido)
server:
  port: 8602

gmail:
  auth_mode: token-only  # Com refresh automático
  # Token Manager integration
  token_manager:
    enabled: true
    base_url: http://localhost:8700
    timeout: 10
    retry_attempts: 3

rabbitmq:
  host: localhost
  port: 5672
  user: guest
  password: guest
  vhost: /
  queues:
    email_send: srv.email.google.sender.message.send.local
    email_send_dlt: srv.email.google.sender.message.send.dlt.local
  exchanges:
    email_exchange: ms-communication-exchange
    email_exchange_dlt: ms-communication-exchange-dlt
  routing_keys:
    email_send: email.google.send
    email_failed: email.failed
  retry:
    max_attempts: 3
    initial_delay_seconds: 5
